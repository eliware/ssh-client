version: "15.0"
description: Lists requirements for the SSH client library.
directives:
  - id: E-250.0
    dos:
      - Expose SSH command, shell, and SFTP operations through the public library API.
      - Verify SSH hosts with known-host records or an approved host certificate authority.
      - Return structured command results and operation errors.
    donts:
      - Do not send private keys or passwords to unverified hosts.
